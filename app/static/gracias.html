<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{BRAND}} · ¡Gracias!</title>
<link rel="stylesheet" href="/static/style.css">
<!-- analítica (se activa solo si hay IDs en Render) -->
<script>
window.__IDS = {ga4: "{{GA4_ID}}", gads: "{{GADS_ID}}", gads_label: "{{GADS_LABEL}}", meta: "{{META_PIXEL_ID}}", clarity: "{{CLARITY_ID}}", pinterest: "{{PINTEREST_TAG_ID}}"};
(function(){ const I = window.__IDS;
  if (I.ga4 || I.gads) { const s=document.createElement('script'); s.async=true; s.src='https://www.googletagmanager.com/gtag/js?id='+(I.ga4||I.gads); document.head.appendChild(s);
    window.dataLayer=window.dataLayer||[]; window.gtag=function(){dataLayer.push(arguments)}; gtag('js', new Date()); if(I.ga4) gtag('config', I.ga4); if(I.gads) gtag('config', I.gads); }
  if (I.meta) { !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js'); fbq('init', I.meta); fbq('track', 'PageView'); }
  if (I.clarity) { (function(c,l,a,r,i,t,y){c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);})(window, document, "clarity", "script", I.clarity); }
  if (I.pinterest) { !function(e){if(!window.pintrk){window.pintrk=function(){window.pintrk.queue.push(Array.prototype.slice.call(arguments))};var n=window.pintrk;n.queue=[],n.version="3.0";var t=document.createElement("script");t.async=!0,t.src=e;var r=document.getElementsByTagName("script")[0];r.parentNode.insertBefore(t,r)}}("https://s.pinimg.com/ct/core.js"); pintrk('load', I.pinterest); pintrk('page'); }
  window.track = function(ev, data){ data = data||{}; try{ if(window.gtag){ gtag('event', ev, data); if(ev==='purchase' && I.gads && I.gads_label) gtag('event','conversion',{send_to: I.gads+'/'+I.gads_label, value: data.value, currency: 'EUR', transaction_id: data.transaction_id}); } if(window.fbq){ const map={view_item:'ViewContent', generate:'Lead', begin_checkout:'InitiateCheckout', purchase:'Purchase'}; fbq('track', map[ev]||ev, {value:data.value, currency:'EUR', content_name:data.item}); } if(window.pintrk && ev==='purchase') pintrk('track','checkout',{value:data.value,currency:'EUR'}); }catch(e){} };
})();
</script>

<link rel="icon" href="/static/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/static/icon-512.png"><link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
</head>
<body>
<header class="top"><a class="logo" href="/">{{BRAND}}</a></header>
<main>
<section class="thanks">
  <h1 id="title">Comprobando tu pago…</h1>
  <img id="img" alt="Tu caricatura" hidden>
  <p id="msg"></p>
  <p id="actions"></p>
  <p class="hint">Guarda esta página: el archivo está disponible 14 días. Si tienes cualquier problema, escríbenos con el número de pedido <code id="job"></code>.</p>
</section>
</main>
<footer><p>{{BRAND}} · Comartinvi S.L.</p></footer>
<script>
const q = new URLSearchParams(location.search); const job = q.get('job');
document.getElementById('job').textContent = job;
(async () => {
  const r = await fetch('/api/status/' + job); const s = await r.json();
  const title = document.getElementById('title'), msg = document.getElementById('msg'), act = document.getElementById('actions'), img = document.getElementById('img');
  if (!s.paid) { title.textContent = 'No encontramos el pago'; msg.textContent = 'Si has pagado, espera un minuto y recarga la página. Si no, vuelve atrás y prueba de nuevo.'; return; }
  img.src = '/api/preview/' + job + '.jpg'; img.hidden = false; try{ if(window.track && !sessionStorage.getItem('p_'+job)){ track('purchase',{value: s.amount||0, transaction_id: job, item: s.product}); sessionStorage.setItem('p_'+job,'1'); } }catch(e){}
  if (s.product === 'digital') {
    title.textContent = '¡Listo! Aquí tienes tu caricatura';
    msg.textContent = 'Descárgala en alta resolución (PNG, 300 dpi), sin marca de agua.';
    act.innerHTML = '<a class="btn btn-primary" href="/api/download/' + job + '.png">Descargar mi caricatura</a>';
  } else {
    title.textContent = '¡Gracias! Tu caricatura está en producción';
    msg.textContent = (s.product === 'canvas' ? 'Lienzo 30x40 cm' : 'Póster A3') + ': se imprime en 1-2 días laborables y llega a casa en 2-5 más. Recibirás el recibo por email.' + (s.gelato_order === 'demo' ? ' (Modo demo: no se ha enviado a imprenta.)' : '');
    act.innerHTML = '<a class="btn btn-primary" href="/api/download/' + job + '.png">Descargar también el archivo</a>';
  }
})();
</script>
</body>
</html>
